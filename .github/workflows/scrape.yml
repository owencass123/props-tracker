name: Scrape Props & Update Dashboard

on:
  workflow_dispatch:   # triggered externally via cron-job.org at exact CT times


permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run scraper
        env:
          UNABATED_USERNAME: ${{ secrets.UNABATED_USERNAME }}
          UNABATED_PASSWORD: ${{ secrets.UNABATED_PASSWORD }}
        run: python scraper.py

      - name: Update results (MLB API)
        run: python update_results.py

      - name: Build dashboard
        run: python build_dashboard.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          cp data/props.csv /tmp/props_generated.csv
          git commit -m "Auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push && exit 0
            echo "Push attempt $i failed, syncing with origin and rebuilding..."
            git rebase --abort 2>/dev/null || true
            git fetch origin
            git reset --hard origin/main
            cp /tmp/props_generated.csv data/props.csv
            python build_dashboard.py
            git add data/ docs/
            git diff --staged --quiet && echo "Already up to date after sync" && exit 0
            git commit -m "Auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
            sleep $((i * 5))
          done
          echo "All push attempts failed" && exit 1
