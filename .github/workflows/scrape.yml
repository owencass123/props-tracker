name: Scrape Props & Update Dashboard

on:
  workflow_dispatch:   # triggered externally via cron-job.org at exact CT times


permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Chrome and matching ChromeDriver
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          CHROME_VER=$(google-chrome --version | grep -oP '[\d.]+')
          echo "Chrome version: $CHROME_VER"
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VER}/linux64/chromedriver-linux64.zip" -O chromedriver.zip
          unzip -q chromedriver.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver
          chromedriver --version

      - name: Test Chrome can launch
        run: |
          echo "Chrome binary: $(which google-chrome)"
          echo "ChromeDriver binary: $(which chromedriver)"
          timeout 10 google-chrome --headless --no-sandbox --disable-dev-shm-usage \
            --dump-dom about:blank 2>&1 | head -5 \
            && echo "✅ Chrome launched OK" || echo "❌ Chrome failed standalone"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          UNABATED_USERNAME: ${{ secrets.UNABATED_USERNAME }}
          UNABATED_PASSWORD: ${{ secrets.UNABATED_PASSWORD }}
        run: python scraper.py

      - name: Update results (MLB API)
        run: python update_results.py

      - name: Build dashboard
        run: python build_dashboard.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          cp data/props.csv /tmp/props_generated.csv
          git commit -m "Auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push && exit 0
            echo "Push attempt $i failed, syncing with origin and rebuilding..."
            git rebase --abort 2>/dev/null || true
            git fetch origin
            git reset --hard origin/main
            cp /tmp/props_generated.csv data/props.csv
            python build_dashboard.py
            git add data/ docs/
            git diff --staged --quiet && echo "Already up to date after sync" && exit 0
            git commit -m "Auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
            sleep $((i * 5))
          done
          echo "All push attempts failed" && exit 1
